---
# Build vlz with the distro-packaged rust/cargo of every enabled OBS target
# (packaging/obs/distro-rust.toml), so an MSRV or dependency bump that a stable
# distro cannot build fails on the pull request or the nightly run instead of
# after a release tag (HC-18; CONTRIBUTING "Rust toolchain and MSRV policy").

name: Distro build

on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**/Cargo.toml
      - packaging/obs/**
      - packaging/rpm/**
      - scripts/distro_rust.py
      - scripts/rust_version.py
      - .github/workflows/distro-build.yml
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gate MSRV against committed distro data
        run: PYTHONPATH="$(pwd)" python3 scripts/distro_rust.py

      - name: List enabled distro targets
        id: targets
        run: |
          set -euo pipefail
          matrix="$(PYTHONPATH="$(pwd)" python3 scripts/distro_rust.py --matrix-json)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: build-${{ matrix.repository }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Install distro Rust and build tools
        env:
          DEPS_COMMAND: ${{ matrix.deps_command }}
        run: |
          set -eu
          sh -c "${DEPS_COMMAND}"
          rustc -vV
          cargo -V

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust workspace for git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Build vlz with distro cargo
        run: cargo build --release --locked -p vlz

      - name: Smoke test
        run: ./target/release/vlz --version
