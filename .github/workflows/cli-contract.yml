---
# From-source CLI contract: path-filtered PR smoke on three OSes; nightly full
# matrix. Not part of make check. Release-tag certification lives in
# release.yml (draft archive download).

name: CLI contract

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "completions/**"
      - "tests/cli_contract/**"
      - "scripts/cli_contract.py"
      - "scripts/cli-contract.sh"
      - "scripts/cli-contract-python.sh"
      - "scripts/release-*.sh"
      - "scripts/ci-install-vlz-release*"
      - "scripts/lib/ci-install-vlz-release-common.sh"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cli-contract.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "completions/**"
      - "tests/cli_contract/**"
      - "scripts/cli_contract.py"
      - "scripts/cli-contract.sh"
      - "scripts/cli-contract-python.sh"
      - "scripts/release-*.sh"
      - "scripts/ci-install-vlz-release*"
      - "scripts/lib/ci-install-vlz-release-common.sh"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cli-contract.yml"
      - ".github/workflows/release.yml"
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: smoke or full
        required: false
        default: full

permissions: {}

jobs:
  cli-contract:
    name: cli-contract-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustc -vV
          cargo -V

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Build vlz
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo build --locked -p vlz

      - name: Resolve binary path
        id: bin
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --no-deps --format-version 1 \
            | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p' | head -1)"
          if [[ -x "${target_dir}/debug/vlz.exe" ]]; then
            echo "path=${target_dir}/debug/vlz.exe" >> "${GITHUB_OUTPUT}"
          else
            echo "path=${target_dir}/debug/vlz" >> "${GITHUB_OUTPUT}"
          fi

      - name: Select contract mode
        id: mode
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "value=full" >> "${GITHUB_OUTPUT}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ github.event.inputs.mode || 'full' }}"
            case "${mode}" in
              smoke | full) echo "value=${mode}" >> "${GITHUB_OUTPUT}" ;;
              *)
                echo "::error::CLI contract mode must be smoke or full" >&2
                exit 1
                ;;
            esac
          else
            echo "value=smoke" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run CLI contract
        run: |
          set -euo pipefail
          PYTHON="$(./scripts/cli-contract-python.sh)"
          "${PYTHON}" scripts/cli_contract.py \
            --binary "${{ steps.bin.outputs.path }}" \
            --mode "${{ steps.mode.outputs.value }}" \
            | tee "${RUNNER_TEMP}/cli-contract.txt"
          "${{ steps.bin.outputs.path }}" --version

      - name: Upload CLI contract report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-contract-${{ matrix.os }}
          path: ${{ runner.temp }}/cli-contract.txt
          if-no-files-found: warn
          retention-days: 14
