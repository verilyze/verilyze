[package]
name = "vlz-fuzz-cflite"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vlz = { path = "../crates/core/vlz" }
vlz-python = { path = "../crates/languages/vlz-python" }
vlz-rust = { path = "../crates/languages/vlz-rust" }
vlz-go = { path = "../crates/languages/vlz-go" }
vlz-javascript = { path = "../crates/languages/vlz-javascript" }
vlz-java = { path = "../crates/languages/vlz-java" }
vlz-ruby = { path = "../crates/languages/vlz-ruby" }

# Independent workspace so root cargo / clippy / deny do not build these.
[workspace]
members = ["."]

[[bin]]
name = "fuzz_config_toml"
path = "fuzz_targets/fuzz_config_toml.rs"
test = false
doc = false
bench = false

