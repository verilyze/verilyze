[package]
name = "vlz-integrity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Optional integrity-checking plugins for verilyze (SHA-256, FIPS-204)"

[features]
default = ["sha256"]
# SEC-004: unkeyed SHA-256 seal per cache entry.
sha256 = []
# SEC-005: ML-DSA-65 signature per cache entry; wins over sha256.
fips204 = ["dep:base64", "dep:ml-dsa"]

[dependencies]
async-trait.workspace = true
base64 = { workspace = true, optional = true }
ml-dsa = { workspace = true, optional = true }
thiserror.workspace = true
vlz-db.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
