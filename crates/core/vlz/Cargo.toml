[package]
name = "vlz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "verilyze - fast, modular SCA command-line tool"

[lib]
name = "vlz"
path = "src/lib.rs"

[[bin]]
name = "vlz"
path = "src/main.rs"

[[bin]]
name = "vlz-manpage-gen"
path = "src/bin/vlz-manpage-gen.rs"
required-features = ["manpage-gen"]

[dependencies]
# Core utilities
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true, optional = true }
clap_mangen.workspace = true
tokio = { workspace = true, features = ["full"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
futures = "0.3"
toml.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

# Workspace-internal trait crates (core siblings)
vlz-db.workspace = true
vlz-manifest-finder.workspace = true
vlz-manifest-parser.workspace = true
vlz-reachability-trait.workspace = true
vlz-reachability.workspace = true
vlz-cve-client.workspace = true
vlz-report.workspace = true
vlz-remediate.workspace = true
vlz-integrity.workspace = true
vlz-plugin-macro.workspace = true

# Language plugins
vlz-python = { workspace = true, optional = true }
vlz-rust = { workspace = true, optional = true }
vlz-go = { workspace = true, optional = true }
vlz-javascript = { workspace = true, optional = true }
vlz-java = { workspace = true, optional = true }
vlz-ruby = { workspace = true, optional = true }
vlz-sbom = { workspace = true, optional = true }

# CVE providers (optional)
vlz-cve-provider-nvd = { workspace = true, optional = true }
vlz-cve-provider-github = { workspace = true, optional = true }
vlz-cve-provider-sonatype = { workspace = true, optional = true }

# Default database implementation (feature-gated)
vlz-db-redb = { workspace = true, optional = true }
vlz-db-mem = { workspace = true, optional = true }

# For mock implementations (feature = "testing")
async-trait = { workspace = true, optional = true }

# Secure temp file/dir creation (SEC-013, FR-023)
tempfile.workspace = true
vlz-lsp = { version = "0.10.0", path = "../vlz-lsp", optional = true }

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
toml.workspace = true

[dev-dependencies]
async-trait.workspace = true
temp-env.workspace = true

# Integration tests that need `mocks` / registry clear helpers: `vlz` is built as a
# normal dependency, so `cfg(test)` is false; enable `--features testing` (see Makefile
# `unit-tests` target).
[[test]]
name = "run_inprocess"
required-features = ["testing"]

[[test]]
name = "exit_code_matrix"
required-features = ["testing"]

[[test]]
name = "minimal_features"
required-features = ["testing"]

[[test]]
name = "mem_cache_ignore"
required-features = ["testing", "mem", "python"]

# Feature gating – matches MOD‑003, MOD‑009
[features]
runtime = ["redb", "python", "rust", "go", "javascript", "java", "ruby", "sbom"]
runtime-mem = ["mem", "python", "rust", "go", "javascript", "java", "ruby", "sbom"]
default = ["runtime", "completions", "docs", "lsp"]
docs = []           # Man page via vlz help; omit for minimal binary
lsp = ["dep:vlz-lsp"]
manpage-gen = []    # Maintainer-only vlz-manpage-gen binary (not installed by default)
completions = ["dep:clap_complete"]
docker = ["runtime-mem"]
redb = ["dep:vlz-db-redb"]
mem = ["dep:vlz-db-mem"]
python = ["vlz-python"]
python-tier-d = ["python", "vlz-python/tier-d"]
rust = ["vlz-rust"]
go = ["vlz-go"]
javascript = ["vlz-javascript"]
java = ["vlz-java"]
ruby = ["vlz-ruby"]
sbom = ["vlz-sbom"]
nvd = ["dep:vlz-cve-provider-nvd"]
github = ["dep:vlz-cve-provider-github"]
sonatype = ["dep:vlz-cve-provider-sonatype"]
# Mocks and registry clear helpers for integration tests (integration tests
# build vlz as a dep, so cfg(test) is false; this feature enables them).
testing = ["async-trait"]
perf-instrumentation = [
    "vlz-reachability/perf-instrumentation",
    "vlz-reachability-trait/perf-instrumentation",
    "vlz-python?/perf-instrumentation",
    "vlz-rust?/perf-instrumentation",
    "vlz-go?/perf-instrumentation",
    "vlz-javascript?/perf-instrumentation",
    "vlz-java?/perf-instrumentation",
    "vlz-ruby?/perf-instrumentation",
]
sqlite = []      # placeholder for a future SQLite backend
vlz-lsp = ["dep:vlz-lsp"]

# ---- Packaging metadata (OP-013) ----

[package.metadata.deb]
maintainer = "Travis Post <post.travis@gmail.com>"
depends = "$auto"
section = "utils"
priority = "optional"
conf-files = ["/etc/verilyze.conf"]
assets = [
    ["target/release/vlz", "/usr/bin/", "755"],
    ["../../../verilyze.conf.example", "/etc/verilyze.conf", "644"],
    ["../../../verilyze.conf.example", "/usr/share/doc/verilyze/verilyze.conf.example", "644"],
    ["../../../man/vlz.1", "/usr/share/man/man1/", "644"],
    ["../../../man/verilyze.conf.5", "/usr/share/man/man5/", "644"],
    ["../../../completions/vlz.bash", "/usr/share/bash-completion/completions/vlz", "644"],
    ["../../../completions/_vlz", "/usr/share/zsh/site-functions/_vlz", "644"],
    ["../../../completions/vlz.fish", "/usr/share/fish/vendor_completions.d/vlz.fish", "644"],
]

[package.metadata.aur]
depends = []
