[package]
name = "vlz-db-mem"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-memory DatabaseBackend for ephemeral CVE cache (Docker / mem builds)"
publish = false

[dependencies]
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
vlz-cve-client = { path = "../../core/vlz-cve-client" }
vlz-db = { path = "../../core/vlz-db" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
