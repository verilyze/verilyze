[package]
name = "vlz-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Python language plugin for verilyze (manifest finder, parser, resolver)"

[dependencies]
async-trait.workspace = true
ruff_python_ast = "=0.0.11"
ruff_python_parser = "=0.0.11"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
regex.workspace = true  # CVE-2022-24713 fix (SEC-022)
tempfile.workspace = true
vlz-db.workspace = true
vlz-manifest-finder.workspace = true
vlz-manifest-parser.workspace = true
vlz-reachability-trait.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "rt"] }

[features]
tier-d = []
perf-instrumentation = ["vlz-reachability-trait/perf-instrumentation"]

[dev-dependencies]
anyhow = "1.0"
temp-env.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
toml.workspace = true
