[package]
name = "vlz-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Rust/Cargo language plugin for verilyze (manifest finder, parser, resolver)"

[dependencies]
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
regex.workspace = true  # CVE-2022-24713 fix (SEC-022)
vlz-db.workspace = true
vlz-manifest-finder.workspace = true
vlz-manifest-parser.workspace = true
vlz-reachability-trait.workspace = true
tokio = { workspace = true, features = ["fs"] }

[features]
perf-instrumentation = ["vlz-reachability-trait/perf-instrumentation"]

[dev-dependencies]
temp-env.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
