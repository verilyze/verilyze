[package]
name = "vlz-ruby"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Ruby language plugin for verilyze (RubyGems ecosystem)"

[dependencies]
async-trait.workspace = true
regex.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "process", "time"] }
vlz-db.workspace = true
vlz-manifest-finder.workspace = true
vlz-manifest-parser.workspace = true
vlz-reachability-trait.workspace = true

[features]
perf-instrumentation = ["vlz-reachability-trait/perf-instrumentation"]

[dev-dependencies]
temp-env = { workspace = true, features = ["async_closure"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
