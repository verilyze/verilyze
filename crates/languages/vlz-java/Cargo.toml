[package]
name = "vlz-java"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Java/Kotlin language plugin for verilyze (Maven ecosystem)"
publish = false

[dependencies]
async-trait.workspace = true
quick-xml = { workspace = true, features = ["encoding"] }
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "time"] }
toml.workspace = true
vlz-db = { path = "../../core/vlz-db" }
vlz-manifest-finder = { path = "../../core/vlz-manifest-finder" }
vlz-manifest-parser = { path = "../../core/vlz-manifest-parser" }
vlz-reachability-trait = { path = "../../core/vlz-reachability-trait" }

[features]
perf-instrumentation = ["vlz-reachability-trait/perf-instrumentation"]

[dev-dependencies]
temp-env.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
