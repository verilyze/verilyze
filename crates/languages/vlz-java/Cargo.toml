[package]
name = "vlz-java"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Java/Kotlin language plugin for verilyze (Maven ecosystem)"

[dependencies]
async-trait.workspace = true
quick-xml = { workspace = true, features = ["encoding"] }
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "time"] }
toml.workspace = true
vlz-db.workspace = true
vlz-manifest-finder.workspace = true
vlz-manifest-parser.workspace = true
vlz-reachability-trait.workspace = true

[features]
perf-instrumentation = ["vlz-reachability-trait/perf-instrumentation"]

[dev-dependencies]
temp-env.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
