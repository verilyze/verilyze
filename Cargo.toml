# ------------------------------------------------------------
# verilyze -- workspace root
# ------------------------------------------------------------
[workspace]
members = [
    "crates/core/*",
    "crates/languages/*",
    "crates/providers/*",
    "crates/db-backends/*",
    "tests/fuzz",              # AFL fuzz targets (NFR-020); build with cargo afl build
]
# Exclude fuzz crate from default build; it requires `cargo afl build` (AFL++).
default-members = [
    "crates/core/vlz",
    "crates/core/vlz-db",
    "crates/db-backends/vlz-db-redb",
    "crates/db-backends/vlz-db-mem",
    "crates/languages/vlz-python",
    "crates/languages/vlz-rust",
    "crates/languages/vlz-go",
    "crates/languages/vlz-javascript",
    "crates/languages/vlz-java",
    "crates/languages/vlz-ruby",
    "crates/languages/vlz-sbom",
    "crates/core/vlz-manifest-finder",
    "crates/core/vlz-manifest-parser",
    "crates/core/vlz-reachability-trait",
    "crates/core/vlz-reachability",
    "crates/core/vlz-cve-client",
    "crates/core/vlz-report",
    "crates/core/vlz-integrity",
    "crates/core/vlz-plugin-macro",
]

# Enforce a single Rust edition for all members
resolver = "2"

# panic=unwind for dev: required by fuzz targets so thread panics are isolated (SEC-017).
# Non-root packages inherit workspace profile; fuzz script builds with profile.dev.
[profile.dev]
panic = "unwind"

# Release profile: strip symbols for security and smaller binary (NFR-023).
[profile.release]
strip = true

# ----------------------------------------------------------------
# Shared workspace-wide metadata (optional but useful)
# ----------------------------------------------------------------
[workspace.package]
version = "0.10.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/verilyze/verilyze"
homepage = "https://github.com/verilyze/verilyze"
authors = ["Travis Post <post.travis@gmail.com>"]
description = "verilyze -- fast, modular Software Composition Analysis tool"
keywords = ["cve", "sbom", "sca", "security", "supply-chain"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
rust-version = "1.98"

# CVE provider HTTP client (OP-018); system-proxy enables macOS/Windows OS proxy when env unset.
[workspace.dependencies]
# Internal workspace crates (version must match [workspace.package].version for crates.io).
vlz-db = { path = "crates/core/vlz-db", version = "0.10.0" }
vlz-manifest-finder = { path = "crates/core/vlz-manifest-finder", version = "0.10.0" }
vlz-manifest-parser = { path = "crates/core/vlz-manifest-parser", version = "0.10.0" }
vlz-reachability-trait = { path = "crates/core/vlz-reachability-trait", version = "0.10.0" }
vlz-reachability = { path = "crates/core/vlz-reachability", version = "0.10.0" }
vlz-cve-client = { path = "crates/core/vlz-cve-client", version = "0.10.0" }
vlz-report = { path = "crates/core/vlz-report", version = "0.10.0" }
vlz-integrity = { path = "crates/core/vlz-integrity", version = "0.10.0" }
vlz-plugin-macro = { path = "crates/core/vlz-plugin-macro", version = "0.10.0" }
vlz-python = { path = "crates/languages/vlz-python", version = "0.10.0" }
vlz-rust = { path = "crates/languages/vlz-rust", version = "0.10.0" }
vlz-go = { path = "crates/languages/vlz-go", version = "0.10.0" }
vlz-javascript = { path = "crates/languages/vlz-javascript", version = "0.10.0" }
vlz-java = { path = "crates/languages/vlz-java", version = "0.10.0" }
vlz-ruby = { path = "crates/languages/vlz-ruby", version = "0.10.0" }
vlz-sbom = { path = "crates/languages/vlz-sbom", version = "0.10.0" }
vlz-cve-provider-nvd = { path = "crates/providers/vlz-cve-provider-nvd", version = "0.10.0" }
vlz-cve-provider-github = { path = "crates/providers/vlz-cve-provider-github", version = "0.10.0" }
vlz-cve-provider-sonatype = { path = "crates/providers/vlz-cve-provider-sonatype", version = "0.10.0" }
vlz-db-redb = { path = "crates/db-backends/vlz-db-redb", version = "0.10.0" }
vlz-db-mem = { path = "crates/db-backends/vlz-db-mem", version = "0.10.0" }
async-trait = "0.1"
clap = "4.6"
clap_complete = "4.6"
clap_mangen = "0.3"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "system-proxy"] }
rustix = { version = "1.1", default-features = false, features = ["fs"] }
serde = "1.0"
serde_json = "1.0.149"
serde_norway = "0.9"
sha2 = "0.11"
temp-env = "0.3"
tempfile = "3.27"
thiserror = "2.0.18"
tokio = "1.51"
toml = "1.1"
quick-xml = "0.42"
wiremock = "0.6"
