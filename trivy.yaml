---
# Super-linter passes `--config` to this file when it lives at the workspace
# root (LINTER_RULES_PATH `.` in scripts/super-linter.sh). Suppresses DB
# download progress. skip-dirs mirrors FILTER_REGEX_EXCLUDE in super-linter.sh
# and skip-path in .checkov.yaml (Trivy does not honor FILTER_REGEX_EXCLUDE).

db:
  no-progress: true
  # Prefer ghcr.io first: Cursor Cloud (and some local egress policies) block
  # mirror.gcr.io, which is Trivy's default and fails hard before fallback.
  # Keep mirror + ECR as alternatives when ghcr is rate-limited.
  repository:
    - ghcr.io/aquasecurity/trivy-db:2
    - public.ecr.aws/aquasecurity/trivy-db:2
    - mirror.gcr.io/aquasec/trivy-db:2
  java-repository:
    - ghcr.io/aquasecurity/trivy-java-db:1
    - public.ecr.aws/aquasecurity/trivy-java-db:1
    - mirror.gcr.io/aquasec/trivy-java-db:1

scan:
  skip-dirs:
    - target
    - "**/target"
    - .git
    - completions
    - .mypy_cache
    - .vlz
    - "**/.vlz"
    - site-packages
    - super-linter-output
    - ".venv"
    - ".venv-reuse"
    - ".venv-test"
    - ".venv-*"
