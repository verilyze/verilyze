title = "verilyze"

[extend]
useDefault = true

# Global allowlist (gitleaks v8): path regexes match detected file paths.
# Cache/build trees match super-linter FILTER_REGEX_EXCLUDE / gitignore intent
# for the native `gitleaks directory` worktree scan.
[allowlist]
description = "TLS test fixture PEM (SEC-024); build and cache trees"
paths = [
  '''.*tests/fixtures/tls_crl/server\.key''',
  '''.*__pycache__/.*''',
  '''.*\.venv[^/]*/.*''',
  '''(.*/)?target/.*''',
  '''.*\.mypy_cache/.*''',
  '''.*\.vlz/.*''',
  '''.*super-linter-output/.*''',
]
